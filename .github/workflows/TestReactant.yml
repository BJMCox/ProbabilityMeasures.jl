# Reactant brings Enzyme and the XLA runtime with it, so it stays out of
# test/Project.toml and out of the main matrix, and gets this job and its own
# environment instead. See test/reactant/runtests.jl.
name: Test Reactant

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - name: Use Julia cache
        uses: julia-actions/cache@v2
      - name: Instantiate the Reactant environment
        run: julia --project=test/reactant -e 'using Pkg; Pkg.instantiate()'
      - name: Run the Reactant conformance block
        run: julia --project=test/reactant test/reactant/runtests.jl
